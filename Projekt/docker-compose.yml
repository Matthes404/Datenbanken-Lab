services:
  mongo-import:
    build:
      context: import
      dockerfile: Dockerfile.mongo
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/ndbk?authSource=admin
      SCENARIO: ${SCENARIO}
    volumes:
      - ./import/data:/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
  neo4j-import:
    build:
      context: ./import
      dockerfile: Dockerfile.neo4j
    env_file: [.env]
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./import/data:/data
  import:
    build: import
    env_file: [.env]
    environment:
      SCENARIO:                 # if empty, value is taken from .env; possible values: abnb, amzn, spot, uber
      CREATE_TABLES: false       # if true, tables are dropped and created
      COPY_DATA: false           # if true, data is copied from csv files into tables
      CREATE_IDX: false          # if true, idx and materialized view are created
    depends_on:
      postgres:
        condition: service_healthy
  mongodb:
    image: mongo
    volumes:
      - ./mongo-data:/data/db
    env_file: [.env]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt Protocol
    volumes:
      - ./data/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $NEO4J_USER -p $NEO4J_PASSWORD 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres
    volumes:
      - ./import/data:/data
    env_file: [.env]
    command: postgres -c shared_buffers=1024MB -c max_wal_size=2048
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
    ports:
      - "5432:5432"
  api:
    build: ./api-service
    container_name: amzn-api
    env_file: [.env]
    depends_on:
      - postgres
      - mongodb
      - neo4j
    ports:
      - "3000:3000"
  duckdb:
    build: duckdb
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: ${POSTGRES_HOST}
    command: ./duckdb -init ${SCENARIO}/import.sql
    tty: true # keep alive
    depends_on:
      import:
        condition: service_completed_successfully
  locust:
    build: locust
    env_file: [.env]
    ports: [8089:8089]
    command: -f ./${SCENARIO}/locusttest.py -H http://amzn-api:3000 -u 100 -r 10 -t 120s
    depends_on:
      postgres:
        condition: service_healthy
  k6:
    build: k6
    env_file: [.env]
    command: sleep infinity # keep alive
    depends_on:
      postgres:
        condition: service_healthy
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_KRAFT_MODE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  ksqldb:
    image: confluentinc/ksqldb-server:0.29.0
    container_name: ksqldb
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: amzn-ksql
    ports:
      - "8088:8088"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KSQLDBSERVER: http://ksqldb:8088
    ports:
      - "8080:8080"

  kafka-producer:
    build: ./kafka-producer
    container_name: kafka-producer
    environment:
      RATE: 2  # 2 reviews per second
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data: